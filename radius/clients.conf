# NAS clients (MikroTik routers)
# Place in /etc/freeradius/clients.conf
# Or use SQL/dynamic clients in production

client mikrotik_nyaururu {
    ipaddr = 192.168.100.1
    secret = ${RADIUS_SECRET}
    nas_type = mikrotik
    require_message_authenticator = no
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

client mikrotik_nakuru {
    ipaddr = 192.168.200.1
    secret = ${RADIUS_SECRET}
    nas_type = mikrotik
    require_message_authenticator = no
}

# Allow local API container (for Docker)
client docker_api {
    ipaddr = 172.16.0.0/12
    secret = ${RADIUS_SECRET}
    nas_type = other
}