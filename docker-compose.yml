version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isp-billing-api
    env_file:
      - .env
    environment:
      APP_ENV: production
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: isp_billing
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      RADIUS_SECRET: ${RADIUS_SECRET}
      RADIUS_API_SECRET: ${RADIUS_API_SECRET}
      ROUTER_ENCRYPTION_KEY: ${ROUTER_ENCRYPTION_KEY}
      ROUTER_USERNAME: ${ROUTER_USERNAME}
      ROUTER_PASSWORD: ${ROUTER_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongodb:
    image: mongo:7.0
    container_name: isp-billing-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  radius:
    build:
      context: ./radius
    container_name: isp-billing-radius
    environment:
      RADIUS_SECRET: ${RADIUS_SECRET}
      RADIUS_API_SECRET: ${RADIUS_API_SECRET}
      RADIUS_API_BASE_URL: ${RADIUS_API_BASE_URL:-http://api:8000}
      MIKROTIK_NAS_CIDR: ${MIKROTIK_NAS_CIDR:-192.168.88.1/32}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${RADIUS_BIND_IP:-127.0.0.1}:1812:1812/udp"
      - "${RADIUS_BIND_IP:-127.0.0.1}:1813:1813/udp"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: isp-billing-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./admin:/usr/share/nginx/html/admin:ro
      - ./portal:/usr/share/nginx/html/portal:ro
      - ./hotspot:/usr/share/nginx/html/hotspot:ro

volumes:
  mongodb_data:
