location = / {
    return 301 /hotspot/;
}

# Authentication and accounting callbacks are private service-to-service APIs.
location = /api/v1/radius {
    return 404;
}

location = /api/v1/radius/auth {
    return 404;
}

location = /api/v1/radius/accounting {
    return 404;
}

location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location /portal/ {
    alias /usr/share/nginx/html/portal/;
    try_files $uri $uri/ /portal/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location /hotspot/ {
    alias /usr/share/nginx/html/hotspot/;
    try_files $uri $uri/ /hotspot/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location /admin {
    return 301 /admin/;
}

location /portal {
    return 301 /portal/;
}

location /hotspot {
    return 301 /hotspot/;
}
